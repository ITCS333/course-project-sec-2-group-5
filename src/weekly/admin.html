<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Weekly Breakdown</title>

    <link rel="stylesheet" href="../../assets/css/style.css">

    <script src="admin.js" defer></script>
</head>
<body>

    <header>
        <h1>Manage Weekly Breakdown</h1>
    </header>

    <main>

        <!-- Add / Edit Week Form -->
        <section>

            <h2>Add a New Week</h2>

            <form id="week-form" action="#">

                <fieldset>

                    <legend>Weekly Details</legend>

                    <!-- Week Title -->
                    <div>
                        <label for="week-title">Week Title</label>

                        <input
                            type="text"
                            id="week-title"
                            placeholder="Week 1: Introduction to HTML"
                            required
                        >
                    </div>

                    <!-- Start Date -->
                    <div>
                        <label for="week-start-date">Start Date</label>

                        <input
                            type="date"
                            id="week-start-date"
                            required
                        >
                    </div>

                    <!-- Description -->
                    <div>
                        <label for="week-description">Description</label>

                        <textarea
                            id="week-description"
                            rows="5"
                        ></textarea>
                    </div>

                    <!-- Resource Links -->
                    <div>
                        <label for="week-links">
                            Resource Links (One URL Per Line)
                        </label>

                        <textarea
                            id="week-links"
                            rows="3"
                        ></textarea>
                    </div>

                    <!-- Submit Button -->
                    <button
                        id="add-week"
                        type="submit"
                    >
                        Add Week
                    </button>

                </fieldset>

            </form>

        </section>


        <!-- Existing Weekly Entries -->
        <section>

            <h2>Current Weekly Breakdown</h2>

            <table id="weeks-table">

                <thead>
                    <tr>
                        <th>Week Title</th>
                        <th>Start Date</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="weeks-tbody">

                    <!-- admin.js will inject rows here -->

                </tbody>

            </table>

        </section>

    </main>

</body>
</html>
