<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Week Details</title>

    <link rel="stylesheet" href="../../assets/css/style.css">

    <script src="details.js" defer></script>

</head>
<body>

    <header>

        <h1 id="week-title"></h1>

    </header>

    <main>

        <!-- Weekly Information -->
        <article>

            <p id="week-start-date"></p>

            <h2>Description & Notes</h2>

            <p id="week-description"></p>

            <h2>Exercises & Resources</h2>

            <ul id="week-links-list">

                <!-- details.js will inject links here -->

            </ul>

        </article>


        <!-- Discussion Forum -->
        <section id="discussion-forum">

            <h2>Discussion</h2>


            <!-- Existing Comments -->
            <div id="comment-list">

                <!-- details.js will inject comments here -->

            </div>


            <!-- Add Comment Form -->
            <form id="comment-form" action="#">

                <fieldset>

                    <legend>Leave a Comment</legend>

                    <div>

                        <label for="new-comment">
                            Comment
                        </label>

                        <textarea
                            id="new-comment"
                            required
                        ></textarea>

                    </div>

                    <button type="submit">
                        Post Comment
                    </button>

                </fieldset>

            </form>

        </section>

    </main>

</body>
</html>
