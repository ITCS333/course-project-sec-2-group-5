<!--
  Requirement: Create the General Discussion Board

  Instructions:
  This page lists all discussion topics and includes a form to create a new one.
-->
<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">

     <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <title>Discussion Board</title>

     <link rel="stylesheet" href="../common/styles.css">

     <script src="board.js" defer></script>
</head>

<body>

     <header>
          <h1>General Discussion Board</h1>
     </header>

     <main>

          <section>
               <h2>Start a New Topic</h2>

               <form id="new-topic-form" action="#">
                    <fieldset>
                         <legend>New Topic Details</legend>

                         <label for="topic-subject">Topic Subject</label>
                         <input id="topic-subject" type="text" placeholder="e.g., Question about CSS Flexbox" required>

                         <label for="topic-author">Your Name</label>
                         <input id="topic-author" type="text" placeholder="e.g., Jane Doe" required>

                         <label for="topic-message">Main Message</label>
                         <textarea id="topic-message" rows="6"
                              placeholder="Describe your discussion topic details here..." required></textarea>

                         <button id="create-topic" type="submit">Create Topic</button>
                    </fieldset>
               </form>
          </section>


          <section>
               <h2>All Topics</h2>

               <div id="topic-list-container">
               </div>
          </section>

     </main>
</body>

</html>
