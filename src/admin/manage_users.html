<!--
  Requirement: Create a Responsive Admin Portal

  Instructions:
  Fill in the HTML elements as described in the comments.
  Use the provided IDs for the elements that require them.
  Focus on creating a clear and semantic HTML structure.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- TODO: Add the 'meta' tag for character encoding (UTF-8). -->
    <meta charset="UTF-8">

    <!-- TODO: Add the responsive 'viewport' meta tag. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- TODO: Add a 'title' for the page, e.g., "Admin Portal". -->
    <title>Admin Portal</title>

    <!-- TODO: Link to a CSS file or a CSS framework. -->
    <link rel="stylesheet" href="../common/styles.css">
    <style>
        /* Search bar width override */
        #search-input { width: 100%; max-width: 360px; display: inline-block; margin-bottom: 14px; }

        /* Action buttons in table cells */
        td button {
            width: auto;
            padding: 6px 14px;
            margin: 0 4px 0 0;
            font-size: .85rem;
        }
        .edit-btn   { background-color: #16a34a; }
        .edit-btn:hover { background-color: #15803d; }
        .delete-btn { background-color: #dc2626; }
        .delete-btn:hover { background-color: #b91c1c; }

        /* Sortable th */
        thead th { cursor: pointer; user-select: none; }
        thead th:hover { background-color: #1d4ed8; }

        /* details/summary */
        details { margin-bottom: 16px; }
        summary { cursor: pointer; font-weight: bold; color: #2563eb; margin-bottom: 10px; }

        header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .back-link { font-size: .9rem; }
    </style>

    <!-- TODO: Add a <script> tag that loads 'manage_users.js' with the 'defer' attribute.
         Example: <script src="manage_users.js" defer></script> -->
    <script src="manage_users.js" defer></script>

</head>
<body>

    <!-- TODO: Create a 'header' element for the top of the page. -->
    <header>
        <!-- TODO: Inside the header, add a main heading (e.g., 'h1') with the text "Admin Portal". -->
        <h1>Admin Portal</h1>
        <a class="back-link" href="../../index.html">&larr; Back to Home</a>
    </header>
    <!-- End of the header. -->

    <!-- TODO: Create a 'main' element to hold the primary content of the portal. -->
    <main>

        <!-- Section 1: Password Management -->
        <!-- TODO: Create a 'section' for the password management functionality. -->
        <section>
            <!-- TODO: Add a sub-heading (e.g., 'h2') with the text "Change Your Password". -->
            <h2>Change Your Password</h2>

            <!-- TODO: Create a 'form' for changing the password.
                 - action="#"
                 - id="password-form" -->
            <form id="password-form" action="#">

                <!-- TODO: Use a 'fieldset' to group the password-related fields. -->
                <fieldset>

                    <!-- TODO: Add a 'legend' for the fieldset, e.g., "Password Update". -->
                    <legend>Password Update</legend>

                    <!-- TODO: Add a 'label' for the current password input. 'for' should be "current-password". -->
                    <label for="current-password">Current Password</label>
                    <!-- TODO: Add an 'input' for the current password.
                         - type="password"
                         - id="current-password"
                         - required -->
                    <input type="password" id="current-password" name="current-password" required>

                    <!-- TODO: Add a 'label' for the new password input. 'for' should be "new-password". -->
                    <label for="new-password">New Password</label>
                    <!-- TODO: Add an 'input' for the new password.
                         - type="password"
                         - id="new-password"
                         - minlength="8"
                         - required -->
                    <input type="password" id="new-password" name="new-password" minlength="8" required>

                    <!-- TODO: Add a 'label' for the confirm password input. 'for' should be "confirm-password". -->
                    <label for="confirm-password">Confirm New Password</label>
                    <!-- TODO: Add an 'input' to confirm the new password.
                         - type="password"
                         - id="confirm-password"
                         - required -->
                    <input type="password" id="confirm-password" name="confirm-password" required>

                    <!-- TODO: Add a 'button' to submit the form.
                         - type="submit"
                         - id="change"
                         - Text: "Update Password" -->
                    <button type="submit" id="change">Update Password</button>

                </fieldset>
                <!-- End of the fieldset. -->

            </form>
            <!-- End of the password form. -->

        </section>
        <!-- End of the password management section. -->


        <!-- Section 2: User Management -->
        <!-- TODO: Create another 'section' for the user management functionality. -->
        <section>
            <!-- TODO: Add a sub-heading (e.g., 'h2') with the text "Manage Users". -->
            <h2>Manage Users</h2>

            <!-- Subsection 2.1: Add New User Form -->
            <!-- TODO: Create a 'details' element so the "Add User" form can be collapsed. -->
            <details>
                <!-- TODO: Add a 'summary' element inside 'details' with the text "Add New User". -->
                <summary>Add New User</summary>

                <!-- TODO: Create a 'form' for adding a new user.
                     - action="#"
                     - id="add-user-form" -->
                <form id="add-user-form" action="#">

                    <!-- TODO: Use a 'fieldset' to group the new user fields. -->
                    <fieldset>
                        <!-- TODO: Add a 'legend' for the fieldset, e.g., "New User Information". -->
                        <legend>New User Information</legend>

                        <!-- TODO: Add a 'label' and 'input' for the user's full name.
                             - label 'for': "user-name"
                             - input 'id': "user-name"
                             - input 'type': "text"
                             - input: required -->
                        <label for="user-name">Full Name</label>
                        <input type="text" id="user-name" name="user-name" placeholder="e.g. Ali Hassan" required>

                        <!-- TODO: Add a 'label' and 'input' for the user's email.
                             - label 'for': "user-email"
                             - input 'id': "user-email"
                             - input 'type': "email"
                             - input: required -->
                        <label for="user-email">Email Address</label>
                        <input type="email" id="user-email" name="user-email" placeholder="user@example.com" required>

                        <!-- TODO: Add a 'label' and 'input' for the default password.
                             - label 'for': "default-password"
                             - input 'id': "default-password"
                             - input 'type': "password"
                             - input: required
                             - minlength="8" -->
                        <label for="default-password">Default Password</label>
                        <input type="password" id="default-password" name="default-password" minlength="8" placeholder="Min. 8 characters" required>

                        <!-- TODO: Add a 'label' and 'select' for the admin status.
                             - label 'for': "is-admin"
                             - select 'id': "is-admin"
                             - Add two 'option' elements:
                               - value="0" text "Student"
                               - value="1" text "Admin" -->
                        <label for="is-admin">Role</label>
                        <select id="is-admin" name="is-admin">
                            <option value="0">Student</option>
                            <option value="1">Admin</option>
                        </select>

                        <!-- TODO: Add a 'button' to submit the form.
                             - type="submit"
                             - id="add"
                             - Text: "Add User" -->
                        <button type="submit" id="add">Add User</button>

                    </fieldset>
                    <!-- End of the fieldset. -->

                </form>
                <!-- End of the add user form. -->

            </details>
            <!-- End of the 'details' element. -->


            <!-- Subsection 2.2: User List -->
            <!-- TODO: Add a sub-heading (e.g., 'h3') for the list of users, e.g., "Registered Users". -->
            <h3>Registered Users</h3>

            <!-- TODO: Add a search input field.
                 - type="text"
                 - id="search-input"
                 - placeholder e.g. "Search by name or email..." -->
            <input type="text" id="search-input" placeholder="Search by name or email...">

            <!-- TODO: Create a 'table' to display the list of users.
                 - id="user-table" -->
            <table id="user-table">

                <!-- TODO: Create a 'thead' for the table headers. -->
                <thead>
                    <!-- TODO: Create a 'tr' (table row) inside the 'thead'. -->
                    <tr>
                        <!-- TODO: Create 'th' (table header) cells for:
                             "Name", "Email", "Admin", "Actions"
                             Each 'th' should be clickable for sorting. -->
                        <th>Name</th>
                        <th>Email</th>
                        <th>Admin</th>
                        <th>Actions</th>
                    </tr>
                    <!-- End of the row. -->
                </thead>
                <!-- End of 'thead'. -->

                <!-- TODO: Create a 'tbody' for the table body.
                     - id="user-table-body"
                     The rows will be populated dynamically by manage_users.js.
                     Do NOT add any hardcoded rows here. -->
                <tbody id="user-table-body">
                </tbody>

            </table>
            <!-- End of the table. -->

        </section>
        <!-- End of the user management section. -->

    </main>
    <!-- End of the main content area. -->

</body>
</html>
