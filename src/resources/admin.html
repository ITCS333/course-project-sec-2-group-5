<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Resources</title>
    <link rel="stylesheet" href="style.css">
    <script src="admin.js" defer></script>
</head>
<body>

    <header>
        <h1>Manage Course Resources</h1>
    </header>

    <main>

        <!-- Section 1: Add/Edit Resource Form -->
        <section>
            <h2>Add a New Resource</h2>

            <form id="resource-form" action="#">
                <fieldset>
                    <legend>Resource Details</legend>

                    <label for="resource-title">Title</label>
                    <input type="text" id="resource-title" name="resource-title" placeholder="Enter resource title" required>

                    <label for="resource-description">Description</label>
                    <textarea id="resource-description" name="resource-description" rows="4" placeholder="Enter resource description"></textarea>

                    <label for="resource-link">Link</label>
                    <input type="url" id="resource-link" name="resource-link" placeholder="https://example.com" required>

                    <button id="add-resource" type="submit">Add Resource</button>
                </fieldset>
            </form>
        </section>

        <!-- Section 2: Existing Resources List -->
        <section>
            <h2>Existing Resources</h2>

            <table id="resources-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Link</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="resources-tbody">
                    <!-- Example row — will be injected dynamically by admin.js -->
                    <tr>
                        <td>Sample Resource</td>
                        <td>A brief description of this resource.</td>
                        <td><a href="https://example.com" target="_blank">https://example.com</a></td>
                        <td>
                            <button class="edit-btn" data-id="1">Edit</button>
                            <button class="delete-btn" data-id="1">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

</body>
</html>
