<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Details</title>
    <link rel="stylesheet" href="style.css">
    <script src="details.js" defer></script>
</head>
<body>

    <header>
        <h1 id="resource-title">Resource Title</h1>
    </header>

    <main>

        <!-- Section 1: Resource Information -->
        <article>
            <p id="resource-description">Resource description will be loaded here.</p>
            <a id="resource-link" href="#" target="_blank">Access Resource Material</a>
        </article>

        <!-- Section 2: Discussion Forum -->
        <section id="discussion-forum">
            <h2>Discussion</h2>

            <!-- Subsection 2.1: Existing Comments -->
            <div id="comment-list">
                <!-- Example comment — will be injected dynamically by details.js -->
                <article>
                    <p>This resource was incredibly helpful for understanding the topic!</p>
                    <footer>Posted by: Ali Hassan</footer>
                </article>
            </div>

            <!-- Subsection 2.2: Add a Comment Form -->
            <form id="comment-form" action="#">
                <fieldset>
                    <legend>Leave a Comment</legend>

                    <label for="new-comment">Your Comment</label>
                    <textarea id="new-comment" name="new-comment" rows="4" placeholder="Write your comment here..." required></textarea>

                    <button type="submit">Post Comment</button>
                </fieldset>
            </form>

        </section>

    </main>

</body>
</html>
